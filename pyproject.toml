[project]
name = "actions-runner-fleet"
version = "0.1.0"
description = "Declarative fleet manager for persistent GitHub Actions self-hosted runners."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kilotronic LLC" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[project.urls]
Homepage = "https://github.com/kilotronic/actions-runner-fleet"
Issues = "https://github.com/kilotronic/actions-runner-fleet/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100", "EXE", "PLW1510", "RUF059"]
