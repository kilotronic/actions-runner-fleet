version: 2
# Subjects read `build(deps): bump …`, the `<type>: <summary>` form the commit-subject check wants.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message: { prefix: "build", include: "scope" }
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message: { prefix: "build", include: "scope" }
    groups:
      pre-commit-hooks:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message: { prefix: "build", include: "scope" }
