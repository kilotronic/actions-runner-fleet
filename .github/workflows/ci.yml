name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/data-leak-check@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  # Shell scripts (shellcheck), workflows (actionlint), and actions and base images pinned by commit and
  # digest, from kilotronic/checks/lint. The job keeps its ShellCheck name: branch protection requires it.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/lint@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0

  # Secrets in this event's commits: gitleaks (anything shaped like a secret) and trufflehog (keys that still
  # work), from kilotronic/checks/secret-scan.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/secret-scan@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0

  # Real authors on this event's commits, in the owner's domains, from kilotronic/checks/git-identity.
  git-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # allow-bots asks GitHub which pull request a commit came from
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/git-identity@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0
        with:
          domains: ixid.net, kilotronic.com
          allow-bots: dependabot
          commit-subject: true

  # The format and lint bundle from .pre-commit-config.yaml (formatters, ruff, markdownlint, yamllint, ...),
  # the same hooks a commit runs. The identity, secret and private-term hooks run as their own jobs above.
  prek:
    name: Format and lint (prek)
    runs-on: ubuntu-latest
    env:
      SKIP: git-identity,commit-subject,session-trailer,secret-scan,secret-scan-push,data-leak-check,data-leak-check-commit-msg,data-leak-check-pre-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run prek==0.5.11 run --all-files --show-diff-on-failure

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest
      - name: Run pytest
        run: .venv/bin/pytest tests/ -q

  validate:
    name: Validate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check scripts are executable
        # Globbed, not listed. The list this replaced named 5 of the repo's 20
        # tracked scripts, so status.sh, reclaim-ci-disk.sh, exclude-ci-paths.sh,
        # install-menubar.sh, prune.sh and both sandbox suites were never checked
        # — and a new script joined that set by default. The rule the tree
        # already follows: a `_`-prefixed .sh is a sourced library and carries no
        # +x; everything else is runnable and must.
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh' | grep -vE '(^|/)_')
          (( ${#files[@]} )) || { echo "ERROR: no scripts matched — the scan is broken"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              status=1
            fi
          done
          exit $status
      - name: Syntax check (bash -n)
        # Every .sh, libraries included — they are sourced, so a syntax error in
        # one breaks its caller.
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          (( ${#files[@]} )) || { echo "ERROR: no scripts matched — the scan is broken"; exit 1; }
          for f in "${files[@]}"; do
            bash -n "$f" || exit 1
          done
      - name: OrbStack ensure sandbox
        run: ./test-ensure-orbstack.sh
      - name: Job-started hook sandbox
        run: ./test-job-started-hook.sh

  # The one summary check: every job above must succeed.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      [
        data-leak-check,
        shellcheck,
        secret-scan,
        git-identity,
        prek,
        python-tests,
        validate,
      ]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do test "$r" = success; done
