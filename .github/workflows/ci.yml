name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: warning

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest 'ruff==0.16.1'
      - name: Run ruff
        run: .venv/bin/ruff check .
      - name: Run pytest
        run: .venv/bin/pytest tests/ -q

  validate:
    name: Validate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts are executable
        # Globbed, not listed. The list this replaced named 5 of the repo's 20
        # tracked scripts, so status.sh, reclaim-ci-disk.sh, exclude-ci-paths.sh,
        # install-menubar.sh, prune.sh and both sandbox suites were never checked
        # — and a new script joined that set by default. The rule the tree
        # already follows: a `_`-prefixed .sh is a sourced library and carries no
        # +x; everything else is runnable and must.
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh' | grep -vE '(^|/)_')
          (( ${#files[@]} )) || { echo "ERROR: no scripts matched — the scan is broken"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              status=1
            fi
          done
          exit $status
      - name: Syntax check (bash -n)
        # Every .sh, libraries included — they are sourced, so a syntax error in
        # one breaks its caller.
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          (( ${#files[@]} )) || { echo "ERROR: no scripts matched — the scan is broken"; exit 1; }
          for f in "${files[@]}"; do
            bash -n "$f" || exit 1
          done
      - name: OrbStack ensure sandbox
        run: ./test-ensure-orbstack.sh
      - name: Job-started hook sandbox
        run: ./test-job-started-hook.sh
